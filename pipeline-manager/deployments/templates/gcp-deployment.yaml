apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName }}-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      containers:
        - name: {{ .Values.serviceName }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tagPrefix }}-{{ .Values.image.tag }}-{{ .Values.image.tagPostfix }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 120
            failureThreshold: 3
            httpGet:
              path: /pipeline-manager/actuator/health
              port: 8080
              scheme: HTTP
          readinessProbe:
            initialDelaySeconds: 120
            periodSeconds: 120
            failureThreshold: 3
            httpGet:
              path: /pipeline-manager/actuator/health
              port: 8080
              scheme: HTTP
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.java.maxSize }}
            - name: ENV
              value: {{ .Values.env.profile }}
          envFrom:
            - secretRef:
                name: db-secret
            - secretRef:
                name: s3-secret
            - secretRef:
                name: email-secret
            - secretRef:
                name: basic-auth-secret
        - name: cloud-sql-proxy
          image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0"
          args:
            - "--structured-logs"
            - "--port=5432"
            - "--private-ip"
            - "{{ .Values.gcp.projectName }}:{{ .Values.gcp.zone }}:{{ .Values.gcp.dbName }}"
          securityContext:
            runAsNonRoot: true
          resources:
            limits:
              cpu: {{ .Values.cloudSql.resources.limits.cpu }}
              memory: {{ .Values.cloudSql.resources.limits.memory }}
            requests:
              cpu: {{ .Values.cloudSql.resources.requests.cpu }}
              memory: {{ .Values.cloudSql.resources.requests.memory }}
      imagePullSecrets:
        - name: gitlabpullimage
      volumes:
        - name: config
          configMap:
            name: {{ .Values.serviceName }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.serviceName }}
spec:
  selector:
    app: {{ .Values.serviceName }}
  ports:
    - port: 8080
      protocol: TCP
      name: {{ .Values.serviceName }}-app-port
  type: NodePort
