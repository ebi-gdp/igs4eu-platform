#####################################################################################
# Datasource config
#####################################################################################
datasource.pipeline-manager.host=@datasource.pipeline-manager.host@
datasource.pipeline-manager.username=@datasource.pipeline-manager.username@
datasource.pipeline-manager.password=@datasource.pipeline-manager.password@
datasource.pipeline-manager.port=5432
datasource.pipeline-manager.database=pspintervenepro
datasource.pipeline-manager.schema=intervene
datasource.pipeline-manager.ssl-mode=require
datasource.pipeline-manager.driver-class-name=org.postgresql.Driver
datasource.pipeline-manager.hikari.maximum-pool-size=3
datasource.pipeline-manager.hikari.minimum-idle=1
datasource.pipeline-manager.initialization-mode=embedded
#####################################################################################
# Spring Security OAuth2 Client Registration
#####################################################################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.elixir-czech.org/oidc/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.elixir-czech.org/oidc/jwk
#####################################################################################
# Kafka config
#####################################################################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.session.timeout.ms=60000
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.concurrency=1
spring.kafka.producer.properties.linger.ms=1
#
kafka.pipeline-trigger.topic=pipeline-launch
kafka.pipeline-status.topic=pipeline-status
kafka.group.instance-id=pipeline-manager
kafka.listener.max.poll.interval.ms=3600000
kafka.listener.default.poll.timeout.ms=500000
#####################################################################################
# Internal service config
#####################################################################################
intervene.file-handler.base-url=http://localhost:8010/file-handler
intervene.user-manager.base-url=http://localhost:8030/user-manager
intervene.file-handler.globus.user-details.uri=/globus/user
intervene.file-handler.globus.list-files-dir.uri=/globus/guest-collection
intervene.file-handler.globus.create-dir.uri=/globus/guest-collection
#####################################################################################
# S3 credentials
#####################################################################################
# Embassy
ebi-embassy.s3.endpoint=https://uk1s3.embassy.ebi.ac.uk
ebi-embassy.s3.credentials.access-key=@ebi-embassy.s3.credentials.access-key@
ebi-embassy.s3.credentials.secret-key=@ebi-embassy.s3.credentials.secret-key@
ebi-embassy.s3.credentials.region=@ebi-embassy.s3.credentials.region@
# Allas
allas.s3.endpoint=https://a3s.fi
allas.s3.credentials.access-key=@allas.s3.credentials.access-key@
allas.s3.credentials.secret-key=@allas.s3.credentials.secret-key@
allas.s3.credentials.region=@allas.s3.credentials.region@
# Bucket name
s3.bucket-name=intervene-dev
#####################################################################################
# Email config
#####################################################################################
spring.mail.host=outgoing.intervenegeneticscores.org
spring.mail.port=587
spring.mail.username=@intervene.email.username@
spring.mail.password=@intervene.email.password@
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
#####################################################################################
# Message gateway config
#####################################################################################
pipeline-execution.platform=CSC
#####################################################################################
# Basic authentication Config
#####################################################################################
basic.auth.username=@basic.auth.username@
basic.auth.password=@basic.auth.password@
#####################################################################################
# User manager auth
#####################################################################################
user-manager.basic.auth=@user-manager.basic.auth@
#####################################################################################
# Redis Config
#####################################################################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.client-type=lettuce
#####################################################################################
# Jackson Config
#####################################################################################
jackson.date-format=yyyy-MM-dd HH:mm:ss
#####################################################################################
# Platform Config
#####################################################################################
intervene.platform.url=https://dev.intervenegeneticscores.org/pgs-calculator/result?pipelineId=%s
#####################################################################################
# Logging config
#####################################################################################
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.root=WARN
logging.level.uk.ac.ebi.gdp.intervene.pipeline.manager=INFO
logging.level.org.springframework.web=INFO
logging.level.reactor.netty.http.client=INFO
#####################################################################################
# Metrics
#####################################################################################
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.baggage.correlation.enabled=true
