variables:
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -s ci_settings.xml"
  SKIP_TESTS: "-DskipTests=true -Djacoco.skip=true"
  CACHE_KEY: $CI_COMMIT_REF_SLUG

cache:
  key: $CACHE_KEY
  paths:
    - .m2/repository/

stages:
  - build
  - test
  - containerize
  - deploy

#include:
# - local: intervene-commons/.gitlab-ci.yml
# - local: file-handler/.gitlab-ci.yml

.build-module:
  stage: build
  image: maven:3.8.7-eclipse-temurin-19
  script:
    - 'echo "Building $MODULE"'
    - 'mvn $MAVEN_CLI_OPTS -pl $MODULE package $SKIP_TESTS --also-make'
  artifacts:
    paths:
      - "*/target"
    expire_in: 30 min
  only:
    changes:
      - '$MODULE/**/*'

.test-module:
  stage: test
  image: maven:3.8.7-eclipse-temurin-19
  script:
    - 'echo Testing $MODULE'
    - 'mvn $MAVEN_CLI_OPTS -pl $MODULE surefire:test --also-make'

.containerize-module:
  stage: containerize
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/${MODULE}/docker/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}-dev"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: '$CI_COMMIT_TAG =~ /^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*\-\d+\.\d+\.\d+$/'

.deploy-module:
  stage: deploy
  image: bitnami/kubectl:latest #change to stable version
  script:
    - kubectl config get-contexts
    - kubectl config use-context gdp/ga4k:k8s-agent
    - kubectl -n intervene-dev get pods
  #   - sed "s/\$NAMESPACE/intervene-dev/; s/\$TAG/$CI_COMMIT_TAG/"
  #   - kubectl -f $MODULE/deployments/
  only: ['main', 'tags']

build-intervene-commons-module:
  variables:
    MODULE: 'intervene-commons'
  extends:
    - .build-module

build-file-handler-module:
  variables:
    MODULE: 'file-handler'
  extends:
    - .build-module

containerize-file-handler-module:
  variables:
    MODULE: 'file-handler'
  extends:
    - .containerize-module

