apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-handler-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: file-handler
  template:
    metadata:
      labels:
        app: file-handler
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      containers:
        - name: file-handler
          image: {{ .Values.image.repository }}:{{ .Values.image.tagPrefix }}-{{ .Values.image.tag }}-{{ .Values.image.tagPostfix }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          ports:
            - containerPort: 8080
            - containerPort: 9080
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.java.maxSize }}
            - name: ENV
              value: {{ .Values.env.profile }}
          envFrom:
            - secretRef:
                name: ega-aai-secret
            - secretRef:
                name: globus-secret
      imagePullSecrets:
        - name: gitlabpullimage
      volumes:
        - name: config
          configMap:
            name: file-handler-config
---
apiVersion: v1
kind: Service
metadata:
  name: file-handler
  namespace: intervene-dev
  labels:
    app: file-handler
spec:
  selector:
    app: file-handler
  ports:
    - port: 8080
      protocol: TCP
      name: file-handler-app-port
  type: NodePort
