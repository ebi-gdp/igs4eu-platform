image:
  registry: registry.gitlab.com
  name: gitlab-org/gitlab-runner
# tag: v16.10.0

imagePullPolicy: IfNotPresent

gitlabUrl: https://gitlab.ebi.ac.uk/

# You will get this token from https://gitlab.ebi.ac.uk/groups/gdp/-/runners
# Look for 3 dots , top right corner & click, use Registration token.
# Currently stored at GCP secret manger at https://console.cloud.google.com/security/secret-manager/secret/gitlab-runner-registration-token/versions?inv=1&invt=AbqFbQ&project=prj-ext-dev-intervene-413412,
# replace with below string. Secret name is "gitlab-runner-registration-token"
runnerRegistrationToken: {replace-this-string-with-value-stored-at-secret-manager}

concurrent: 10

checkInterval: 30

# AccessKey: https://console.cloud.google.com/security/secret-manager/secret/embassy-s3-access-key/versions?inv=1&invt=AbqFbQ&project=prj-ext-dev-intervene-413412
# SecretKey: https://console.cloud.google.com/security/secret-manager/secret/embassy-s3-secret-key/versions?inv=1&invt=AbqFbQ&project=prj-ext-dev-intervene-413412
runners:
  config: |
    [[runners]]
      executor = "kubernetes"
      [runners.kubernetes]
        image = "alpine"
        namespace = "{{.Release.Namespace}}"
        [runners.cache]
          Type = "s3"
          Path = "runner"
          Shared = true
          [runners.cache.s3]
            ServerAddress = "uk1s3.embassy.ebi.ac.uk"
            AccessKey = "{replace-this-string-with-value-stored-at-secret-manager}"
            SecretKey = "{replace-this-string-with-value-stored-at-secret-manager}"
            BucketName = "gitlab-runner"
            Insecure = false
            AuthenticationType = "access-key"
rbac:
  create: true
  rules:
    - apiGroups: [ "" ]
      resources: [ "pods", "secrets", "configmaps" ]
      verbs: [ "list", "get", "watch", "create", "delete", "patch", "update" ]
    - apiGroups: [ "" ]
      resources: [ "pods/exec", "pods/attach" ]
      verbs: [ "create", "patch", "delete" ]
    - apiGroups: [ "" ]
      resources: [ "pods/log" ]
      verbs: [ "get" ]
    - apiGroups: [ "policy" ]
      resources: [ "podsecuritypolicies" ]
      verbs: [ "use" ]

resources:
  limits:
    memory: 2048Mi
    cpu: 2000m
  requests:
    memory: 1024Mi
    cpu: 1000m
